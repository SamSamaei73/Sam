[project]
name = "sam"
version = "0.1.0"
description = "Phase 1 backend foundation for Sam"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "anthropic>=0.40,<1.0",
    "fastapi>=0.115,<1.0",
    "httpx>=0.27,<1.0",
    "pydantic-settings>=2.7,<3.0",
    "uvicorn>=0.34,<1.0",
]

[dependency-groups]
dev = [
    # Required by the current starlette.testclient (it prefers httpx2 and
    # deprecates httpx). Test-only: Sam's production HTTP client stays httpx.
    "httpx2>=2.13,<3",
    "mypy>=1.15,<2.0",
    "pytest>=9.0.3,<10.0",
    "ruff>=0.9,<1.0",
]
# Heavy local voice stack for Phase 12 (owner speaker verification, local
# Persian/English STT, Keychain-backed profile store). Deliberately NOT part of
# the minimal install and NOT needed by the core test suite (which uses fakes):
#   uv sync --group voice-local
# macOS on Apple silicon only, because the owner template lives in the macOS
# Keychain. torch and torchaudio must be pinned as a matching pair.
voice-local = [
    "torch==2.11.0; sys_platform == 'darwin' and platform_machine == 'arm64'",
    "torchaudio==2.11.0; sys_platform == 'darwin' and platform_machine == 'arm64'",
    "speechbrain==1.1.1; sys_platform == 'darwin' and platform_machine == 'arm64'",
    "faster-whisper==1.2.1; sys_platform == 'darwin' and platform_machine == 'arm64'",
    "keyring>=25.7,<26; sys_platform == 'darwin'",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/sam"]

[tool.pytest.ini_options]
addopts = "-ra"
testpaths = ["tests"]
pythonpath = ["src"]
filterwarnings = [
    "error",
    # Fixed upstream after Starlette 1.6.0; remove after upgrading Starlette.
    "ignore:The anyio\\.abc\\.BlockingPortal alias is deprecated, use anyio\\.from_thread\\.BlockingPortal instead\\.:DeprecationWarning:starlette\\.testclient",
]

[tool.ruff]
target-version = "py312"
line-length = 88
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.mypy]
python_version = "3.12"
strict = true
mypy_path = "src"

# The heavy local-voice libraries live in the optional ``voice-local`` group and
# are imported lazily; they may be absent (or untyped) when type-checking.
[[tool.mypy.overrides]]
module = [
    "torch",
    "torch.*",
    "speechbrain",
    "speechbrain.*",
    "faster_whisper",
    "faster_whisper.*",
    "keyring",
    "keyring.*",
    "huggingface_hub",
    "huggingface_hub.*",
    "numpy",
    "numpy.*",
]
ignore_missing_imports = true
