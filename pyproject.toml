[project]
name = "sam"
version = "0.1.0"
description = "Phase 1 backend foundation for Sam"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "anthropic>=0.40,<1.0",
    "fastapi>=0.115,<1.0",
    "httpx>=0.27,<1.0",
    "pydantic-settings>=2.7,<3.0",
    "uvicorn>=0.34,<1.0",
]

[dependency-groups]
dev = [
    "mypy>=1.15,<2.0",
    "pytest>=9.0.3,<10.0",
    "ruff>=0.9,<1.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/sam"]

[tool.pytest.ini_options]
addopts = "-ra"
testpaths = ["tests"]
pythonpath = ["src"]
filterwarnings = [
    "error",
    # Fixed upstream after Starlette 1.6.0; remove after upgrading Starlette.
    "ignore:The anyio\\.abc\\.BlockingPortal alias is deprecated, use anyio\\.from_thread\\.BlockingPortal instead\\.:DeprecationWarning:starlette\\.testclient",
]

[tool.ruff]
target-version = "py312"
line-length = 88
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.mypy]
python_version = "3.12"
strict = true
mypy_path = "src"
