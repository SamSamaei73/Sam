[package]
name = "sam-desktop"
version = "0.11.0"
description = "Sam desktop shell. Not an authorization boundary: PermissionEngine is the sole authority."
edition = "2021"
rust-version = "1.77"
publish = false

[lib]
name = "sam_desktop_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
# Plain-HTTP client for the fixed loopback backend only: no TLS stack, no
# redirects (configured in code), no proxy support.
ureq = { version = "3", default-features = false }

[profile.release]
panic = "abort"
codegen-units = 1
lto = true
opt-level = "s"
strip = true
